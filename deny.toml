# cargo-deny configuration
# Run with: cargo deny check

[licenses]
allow=["MIT", "Apache-2.0",  "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "ISC", "BSD-3-Clause"]

[bans]
multiple-versions = "warn"
deny = [
    { name = "openssl", reason = "use rustls instead for cross-platform TLS" },
]

[advisories]
# vulnerability = "deny"
unmaintained = "all"
yanked = "deny"