# cargo-deny configuration
# Run with: cargo deny check

[licenses]
allow=["MIT", "Apache-2.0",  "Apache-2.0 WITH LLVM-exception", "Unicode-DFL"]
deny = ["GPL-2.0", "GPL-3.0", "AGPL-3.0"]

[bans]
multiple-versions = "warn"
deny = [
    { name = "openssl", reason = "use rustls instead for cross-platform TLS" },
]

[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"