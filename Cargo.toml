[workspace]
resolver = "2"
members = [
    "crates/forge-cli",
    "crates/forge-core",
    "crates/forge-template",
    "crates/forge-config",
    "crates/forge-tests"
]

[workspace.dependencies]
# Shared dependencies for all crates
clap = { version = "4", features = ["derive", "env"] }
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tera = "1"
heck = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
console = "0.15"
tempfile = "3"
clap_complete = "4"
supports-color = "3"
# Testing
insta ={ version = "1", features = ["json", "filters"]}
proptest="1"
assert_cmd="2"
predicates= "2"

[profile.release]
opt-level = 3
lto = true          
codegen-units = 1   
strip = true  
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"

[workspace.package]
rust-version = "1.90.0"

