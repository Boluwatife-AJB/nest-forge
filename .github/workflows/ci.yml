name: CI

on: 
  push:
    branches: [ main, dev, staging ]
  pull_request:
    branches: [ main, dev, staging ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Make insta fail on new/changed snapshots in CI
  # Developers must review and commit snapshots locally
  INSTA_UPDATE: unseen

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # - name: Check formatting
      #   run: cargo fmt --all -- --check
      
      - name: Check formatting
        run: cargo fmt

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check that Cargo.lock is up to date
        run: cargo update --locked
  
  tests:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        rust: [ stable, beta ]
        exclude:
          - os: windows-latest
            rust: beta
          - os: macos-latest
            rust: beta

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with: 
          key: ${{ matrix.os }}-${{ matrix.rust }}

      - name: Build workspace
        run: cargo build --workspace

      - name: Run unit and integration tests
        run: cargo test --workspace

      - name: Run snapshot tests
        run: cargo test -p forge-template --test snapshot_tests

      - name: Run property-based tests
        run: cargo test -p forge-core --test property_tests

      - name: Run integration tests
        run: cargo test -p forge-tests
  
  snapshots:
    name: Snapshots Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run snapshot tests
        run: | 
          INSTA_UPDATE=unseen cargo test -p forge-template --test snapshot_tests

  msrv:
    name: MSRV Check (Rust 1.90)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo check --workspace

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check licenses and advisories
        run: cargo deny check
    
  release-build: 
    name: Release build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release profile
        run: cargo build --release --workspace

      - name: Report binary size
        run: |
          ls -lh target/release/forge
          echo "Binary size: $(du -sh target/release/forge | cut -f1)"

